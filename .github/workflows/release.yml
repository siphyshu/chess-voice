name: Release

# Push a tag that matches manifest.json's version (e.g. v1.0.1) to publish a
# GitHub release with the store-ready zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension
        run: node scripts/check.mjs
      - name: Tag must match manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $VERSION" >&2
            exit 1
          fi
      - name: Package
        run: ./scripts/package.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
