name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension
        run: node scripts/check.mjs
      - name: Package
        run: ./scripts/package.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: chess-voice
          path: dist/*.zip
