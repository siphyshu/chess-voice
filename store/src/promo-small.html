<html><head><style>
  body { margin:0; width:440px; height:280px; overflow:hidden; font-family:-apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
         background:#1c2419; color:#eef3ea; position:relative; }
  .board { position:absolute; inset:0; opacity:.07;
           background: conic-gradient(#fff 25%, transparent 0 50%, #fff 0 75%, transparent 0) 0 0/56px 56px; }
  .glow { position:absolute; width:340px; height:340px; left:-90px; top:-30px; border-radius:50%;
          background: radial-gradient(circle, rgba(106,164,87,.35), transparent 65%); }
  .wrap { position:relative; height:100%; display:flex; align-items:center; gap:26px; padding:0 34px; }
  img { width:112px; height:112px; flex:none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  h1 { margin:0 0 8px; font-size:38px; font-weight:700; letter-spacing:-.02em; }
  p { margin:0; font-size:17px; line-height:1.35; color:#c3d0bd; }
  .sites { margin-top:14px; font-size:13px; color:#8fc27c; font-weight:600; letter-spacing:.02em; }
</style></head><body>
  <div class="board"></div><div class="glow"></div>
  <div class="wrap">
    <img src="icon.svg">
    <div>
      <h1>Chess Voice</h1>
      <p>Talk to your opponent<br>while you play.</p>
      <div class="sites">lichess.org · chess.com</div>
    </div>
  </div>
</body></html>
